<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF9C4"/>
      <stop offset="100%" style="stop-color:#F8BBD0"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Capybara face -->
  <ellipse cx="96" cy="105" rx="50" ry="42" fill="#A1887F"/>
  <ellipse cx="96" cy="112" rx="32" ry="25" fill="#BCAAA4"/>
  <!-- Ears -->
  <ellipse cx="60" cy="72" rx="10" ry="7" fill="#8D6E63"/>
  <ellipse cx="132" cy="72" rx="10" ry="7" fill="#8D6E63"/>
  <!-- Eyes -->
  <circle cx="80" cy="98" r="6" fill="#333"/>
  <circle cx="112" cy="98" r="6" fill="#333"/>
  <circle cx="82" cy="96" r="2.5" fill="white"/>
  <circle cx="114" cy="96" r="2.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="96" cy="112" rx="8" ry="5" fill="#5D4037"/>
  <circle cx="92" cy="111" r="2" fill="#333"/>
  <circle cx="100" cy="111" r="2" fill="#333"/>
  <!-- Mouth -->
  <path d="M 86 120 Q 96 128 106 120" fill="none" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
