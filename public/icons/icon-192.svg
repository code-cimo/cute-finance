  <circle cx="68" cy="110" r="7" fill="#FFB6C1" opacity="0.4"/>
  <circle cx="124" cy="110" r="7" fill="#FFB6C1" opacity="0.4"/>
  <!-- Coin -->
  <circle cx="145" cy="55" r="18" fill="#FFD54F" stroke="#FFC107" stroke-width="2"/>
  <text x="145" y="62" text-anchor="middle" font-size="18" font-weight="bold" fill="#F57F17">$</text>
  <!-- Flower -->
  <circle cx="50" cy="65" r="5" fill="#FFD54F"/>
  <circle cx="45" cy="61" r="4" fill="#FFF176"/>
  <circle cx="55" cy="61" r="4" fill="#FFF176"/>
  <circle cx="47" cy="69" r="4" fill="#FFF176"/>
  <circle cx="53" cy="69" r="4" fill="#FFF176"/>
</svg>
