version: '3.8'

services:
  cutefinance:
    build: .
    container_name: cutefinance-pwa
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      # Optional: persist data (for future backend integration)
      - cutefinance-data:/data
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.cutefinance.rule=Host(`cutefinance.local`)"

volumes:
  cutefinance-data:
    driver: local
